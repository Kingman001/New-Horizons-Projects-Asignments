<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 5b - Arial Font</title>
  <style type="text/css" media="all">
    .arialBig{
      font-family: Arial;
      font-size: 3.5em;
      font-weight: 600;
      padding: 0;
      margin-bottom: 0;
    }
    
    .arialSmall{
      font-family: Arial;
      font-size: 2em;
      font-style: italic;
      color: red;
      margin-top: 0;
    }
  </style>
</head>
<body>
  <p class="arialBig">Biggest Deals of the Year!</p>
  <p class="arialSmall">Sales end Tuesday</p>
</body>
</html>
