<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 5f - multiple span tags 1</title>
  <style type="text/css" media="all">
    p{
      font-family: Arial;
      margin: 10px 50px;
      padding: 0;
    }
    
    .amount{
      font-size: 5em;
    }
    
    .usd{
      font-size: 2.5em;
      color: rgb(150,150,150);
      padding-left: 15px;
    }
    
    .rate{
      font-size: 2.5em;
      color: green;
    }
    
    .newAmount{
      font-size: 2.5em;
    }
    
    .decline{
      color: darkred;
    }
  </style>
</head>
<body>
  <p><span class="amount">1,049.61</span> <span class="usd">USD</span></p>
  <p class="rate">+18.05 (1.75%) today</p>
  <p class="newAmount">After hours 1,048.00 <span class="decline">-1.61 (0.15%)</span></p>
</body>
</html>
