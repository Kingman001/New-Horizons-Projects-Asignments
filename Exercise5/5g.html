<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 5f - multiple span tags 1</title>
  <style type="text/css" media="all">
    p{
      font-family: Arial;
      font-size: 2em;
      font-weight: 400;
      margin-left: 20px;
    }
    
    .userName{
      font-weight: bold;
    }
    
    .userTag{
      color: rgb(150,150,150);
      padding-left: 5px;
    }
  
    .userTag2{
      color: rgb(0,150,255);
      
    }
  </style>
</head>
<body>
  <p><span class="userName">freeCodeCamp.org</span> <span class="userTag">@freeCodeCamp 1h</span></p>
  <p>As a web developer, you'll want to make your projects easy to use and navigate around.</p>
  <p>Here <span class="userTag2">@chp_it</span> outlines the top skills new developers should have.</p>
</body>
</html>
