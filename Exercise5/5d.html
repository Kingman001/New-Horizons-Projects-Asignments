<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 5b - Arial Font</title>
  <style type="text/css" media="all">
    p, .learnMore{
      font-family: Arial;
      text-align: center;
    }
    
    .question{
      font-size: 3.5em;
      font-weight: 600;
    }
    
    .seeApple, .learnMore{
      font-size: 2em;
    }
    
    .learnMore{
      text-decoration: none;
      font-style: italic;
    }
  </style>
</head>
<body>
  <p class="question">Shopping for your Business?</p>
  <p class="seeApple">See how Apple at Work can help.</p>
  <p><a class="learnMore" href="#">Learn more></a></p>
</body>
</html>
