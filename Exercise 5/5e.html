<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 5c - verdana Font</title>
  <style type="text/css" media="all">
    body{
      font-family: Arial;
      text-align: center;
    }
    
    p{
      padding: 5px;
      margin: 0;
    }
    
    .tag{
      font-size: 3.5em;
      font-weight: 600;
    }
    
    .condition{
      font-size: 1em;
      color: orangered;
    }
    
    .product{
      font-size: 2em;
      font-weight: 500;
    }
    
    .buyBtn{
      font-size: 1.25em;
      background-color: dodgerblue;
      color: white;
      padding: 5px 15px;
      border-radius: 50px;
      border: none;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <p class="condition">New</p>
  <p class="product">MacBook Pro</p>
  <p class="tag">Supercharged for pros.</p>
  <p class="price">From $1999</p>
  <button class="buyBtn">Buy</button>
</body>
</html>
