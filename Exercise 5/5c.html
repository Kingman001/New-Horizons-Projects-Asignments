<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 5c - verdana Font</title>
  <style type="text/css" media="all">
    .titleText{
      font-family: Verdana;
      font-size: 3.5em;
      font-weight: 600;
      padding: 0;
      margin-bottom: 0;
    }
    
    .tag{
      font-family: Verdana;
      font-size: 2em;
      font-style: italic;
      color: grey;
      margin-top: 0;
    }
    
    .description{
      font-family: Verdana;
      font-size: 2em;
    }
    
    button{
      font-family: Verdana;
      font-size: 1.5em;
      background-color: green;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
    }
  </style>
</head>
<body>
  <p class="titleText">HTML CSS Course</p>
  <p class="tag">Beginner to Pro</p>
  <p class="description">In this course, we'll learn the skills<br/>you need to become a developer.</p>
  <button>Get Started</button>
</body>
</html>
