<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 11a - grid layouts 1</title>
    <style type="text/css" media="all">
      body {
    font-family: Arial;
    background-color: #fff;
    color: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 50px;
}

.container {
    display: grid;
    grid-template-columns: 200px 75px;
    align-items: center;
}

.column1{
  background-color: powderblue;
}

.column2{
  background-color: #f8d8e0;
}
    </style>
</head>
<body>
    <div class="container">
        <div class="column1">
          <p>200px</p>
        </div>
        
        <div class="column2">
          <p>75px</p>
        </div>
    </div>
</body>
</html>
