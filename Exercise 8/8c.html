<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 8c - Google search bar</title>
  <style type="text/css" media="all">
    #logo{
      width: 50%;
      display: block;
      height: auto;
      margin-left: 25%;
    }
    #searchBar{
      width: 85%;
      display: block;
      font-size: 1.8rem;
      padding: 1.5rem 2rem;
      margin-left: 5%;
      margin-top: 20px;
      border-radius: 5rem;
      border: none;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <form action="" method="get" accept-charset="utf-8">
    <img src="google logo.jpeg" id="logo" alt="google logo" />
    <input type="text" name="searchInput" id="searchBar" placeholder="Search Google or type a URL"/>
  </form>
</body>
</html>
